name: Research collection & Pages
on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "config/**"
      - "scripts/**"
      - "web/**"
      - "tests/**"
      - "data/**"
      - ".github/workflows/research.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 08:10 Asia/Singapore, 00:10 UTC.
    - cron: "10 0 * * *"
permissions:
  contents: read
concurrency:
  group: ai-industry-research-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate stored evidence
        run: python scripts/pipeline.py validate
      - name: Generate analytical report and validate Pages contract
        run: |
          python scripts/pipeline.py analyze
          python scripts/pipeline.py build
          python - <<'PY'
          import json
          from pathlib import Path
          dashboard = json.loads(Path("_site/data/dashboard.json").read_text())
          assert all(k in dashboard for k in ("stats", "sources", "series", "reports", "articles", "analysis"))
          assert dashboard["analysis"]["schema_version"] == 1
          assert len(dashboard["analysis"]["charts"]) >= 3
          assert Path("data/reports/analysis/latest.json").exists()
          assert Path("data/reports/quality/latest.json").exists()
          assert dashboard["quality"]["schema_version"] == 1
          assert Path("_site/index.html").exists()
          assert Path("_site/app.js").exists()
          print("Dashboard build contract valid")
          PY
  publish:
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and normalize source evidence
        id: collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: |
          # Recollect after a source/collector change; otherwise lightweight Pages build.
          if [ "$EVENT_NAME" = "push" ] && [ -f data/status/latest.json ] &&
             ! git diff-tree --no-commit-id --name-only -r HEAD | grep -Eq '^(config/sources.json|scripts/(pipeline|economic|analytics|sec_financials)\.py|\.github/workflows/research\.yml)$'; then
            echo "collected=false" >> "$GITHUB_OUTPUT"
          else
            python scripts/pipeline.py collect
            echo "collected=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Validate results
        run: python scripts/pipeline.py validate
      - name: Aggregate data into evidence reports
        run: python scripts/pipeline.py analyze
      - name: Commit daily evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "data: daily evidence snapshot $(date -u +%Y-%m-%d)"
            git push origin HEAD:main
          else
            echo "No evidence changes to commit"
          fi
      - name: Build static Pages site
        run: python scripts/pipeline.py build
      - name: Check Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Pages is not enabled or accessible. Enable Settings > Pages > Source: GitHub Actions."
            echo "### GitHub Pages not yet enabled" >> "$GITHUB_STEP_SUMMARY"
            echo "Enable **Settings → Pages → GitHub Actions** to publish the existing _site build. Data collection remains operational." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: "_site"
      - name: Deploy
        if: steps.pages.outputs.enabled == 'true'
        id: deploy
        uses: actions/deploy-pages@v4
