name: Research collection & Pages
on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "config/**"
      - "scripts/**"
      - "web/**"
      - "tests/**"
      - "data/**"
      - ".github/workflows/research.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 08:10 Asia/Singapore, 00:10 UTC.
    - cron: "10 0 * * *"
permissions:
  contents: read
concurrency:
  group: ai-industry-research-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate client JavaScript syntax
        run: node --check web/app.js
      - name: Validate stored evidence
        run: python scripts/pipeline.py validate
      - name: Generate analytical report and validate Pages contract
        run: |
          python scripts/pipeline.py analyze
          python scripts/pipeline.py build
          python - <<'PY'
          import json
          from pathlib import Path
          dashboard = json.loads(Path("_site/data/dashboard.json").read_text())
          assert all(k in dashboard for k in ("stats", "sources", "series", "reports", "articles", "analysis"))
          assert dashboard["analysis"]["schema_version"] == 1
          assert len(dashboard["analysis"]["charts"]) >= 3
          assert Path("data/reports/analysis/latest.json").exists()
          assert Path("data/reports/quality/latest.json").exists()
          assert dashboard["quality"]["schema_version"] == 1
          assert Path("_site/index.html").exists()
          assert Path("_site/app.js").exists()
          import hashlib, re
          site_html = Path("_site/index.html").read_text()
          for asset in ("app.js", "styles.css"):
              file_bytes = Path("_site", asset).read_bytes()
              stem, extension = asset.rsplit(".", 1)
              asset_hash = hashlib.sha256(file_bytes).hexdigest()[:12]
              fingerprinted = f"{stem}.{asset_hash}.{extension}"
              assert Path("_site", fingerprinted).read_bytes() == file_bytes
              assert f'./{fingerprinted}' in site_html
              assert f'="./{asset}"' not in site_html
          assert dashboard["financial_data"]["schema_version"] == 1
          issuers = dashboard["financial_data"]["companies"]
          assert len(issuers) == len(dashboard["sources"]["financials"])
          for issuer in issuers:
              assert "fiscal_year_end" in issuer
              assert "history" in issuer
              assert all(value["period"] == issuer["fiscal_year_end"]
                         for value in issuer["metrics"].values())
          site = Path("_site/index.html").read_text()
          for section in ("overview", "financials", "adoption", "models", "ecosystem", "sources"):
              assert f'id="data-{section}"' in site
              assert f'data-data-tab="{section}"' in site
          for target in ("finance-charts", "adoption-charts", "model-charts", "ecosystem-charts", "finance-table-body"):
              assert f'id="{target}"' in site
          print("Dashboard categories, SEC directory and accessible tab contracts valid")
          PY
      - name: Exercise real browser interactions
        run: node tests/browser_smoke.mjs
  publish:
    if: github.event_name != 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch and normalize source evidence
        id: collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
        run: |
          # Recollect after a source/collector change; otherwise lightweight Pages build.
          if [ "$EVENT_NAME" = "push" ] && [ -f data/status/latest.json ] &&
             ! git diff-tree --no-commit-id --name-only -r HEAD | grep -Eq '^(config/sources.json|scripts/(pipeline|economic|analytics|sec_financials)\.py|\.github/workflows/research\.yml)$'; then
            echo "collected=false" >> "$GITHUB_OUTPUT"
          else
            python scripts/pipeline.py collect
            echo "collected=true" >> "$GITHUB_OUTPUT"
          fi
      - name: SEC onboarding verification
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path("data/status/latest.json").read_text())
          sec = [s for s in status["sources"] if s["source_id"].startswith("sec_")]
          summary = ["### SEC Company Facts source verification", "",
                     "| Issuer | Status | Annual facts |",
                     "| --- | --- | ---: |"]
          for s in sec:
              summary.append("| {} | {} | {} |".format(
                  s["source_id"], s["status"], s["records"]))
              if s["status"] == "failed":
                  print("SEC source failed:", s["source_id"], s.get("error", ""))
          if not sec:
              raise SystemExit("No SEC sources registered in latest collection status")
          Path(__import__("os").environ["GITHUB_STEP_SUMMARY"]).open("a").write(
              "\n".join(summary) + "\n")
          configured = [s for s in sec if s["status"] != "skipped_config"]
          if configured and not any(s["status"] == "ok" for s in configured):
              raise SystemExit("SEC_USER_AGENT configured, but all SEC financial sources failed")
          print("SEC verification:", len(sec), "sources;", 
                sum(s["status"] == "ok" for s in sec), "successful")
          PY
      - name: Validate results
        run: python scripts/pipeline.py validate
      - name: Aggregate data into evidence reports
        run: python scripts/pipeline.py analyze
      - name: Commit daily evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "data: daily evidence snapshot $(date -u +%Y-%m-%d)"
            git push origin HEAD:main
          else
            echo "No evidence changes to commit"
          fi
      - name: Build static Pages site
        run: python scripts/pipeline.py build
      - name: Check Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Pages is not enabled or accessible. Enable Settings > Pages > Source: GitHub Actions."
            echo "### GitHub Pages not yet enabled" >> "$GITHUB_STEP_SUMMARY"
            echo "Enable **Settings → Pages → GitHub Actions** to publish the existing _site build. Data collection remains operational." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/configure-pages@v5
        if: steps.pages.outputs.enabled == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.pages.outputs.enabled == 'true'
        with:
          path: "_site"
      - name: Deploy
        if: steps.pages.outputs.enabled == 'true'
        id: deploy
        uses: actions/deploy-pages@v4
